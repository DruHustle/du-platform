name: Deploy to Render

on:
  # Auto-trigger Render deploy hook on pushes to main.
  push:
    branches: [main]
  # Allow manual deploy hook trigger from the Actions tab.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Trigger Render Deployment
        run: |
          # Requires repo secret: RENDER_DEPLOY_HOOK_URL
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      
      - name: Deployment notification
        run: |
          echo "Deployment triggered successfully on Render"
          echo "Check deployment status at: https://dashboard.render.com"
