name: Generic iOS Release archive
on:
  push:
    branches: [validation/archive-release-173]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-device-archive.yml"
      - "du-platform-frontend/mobile/ios/**"
      - "du-platform-frontend/mobile/src/**"
      - "du-platform-frontend/mobile/package-lock.json"
      - "du-platform-frontend/mobile/app.json"

permissions:
  contents: read

jobs:
  archive:
    name: Verify unsigned physical iOS Release archive
    runs-on: macos-26
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
        working-directory: du-platform-frontend/mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://www.diasporaunlocked.com/api
      EXPO_PUBLIC_WEB_URL: https://www.diasporaunlocked.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: du-platform-frontend/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native iOS dependencies
        working-directory: du-platform-frontend/mobile/ios
        run: pod install
      - name: Archive the unsigned physical iOS Release
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -workspace ios/DiasporaUnlocked.xcworkspace -scheme DiasporaUnlocked \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DiasporaUnlocked.xcarchive" -derivedDataPath "$RUNNER_TEMP/du-device-build" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= archive
      - name: Verify physical iOS archive identity and architecture
        run: |
          archive="$RUNNER_TEMP/DiasporaUnlocked.xcarchive"
          app="$archive/Products/Applications/DiasporaUnlocked.app"
          info="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'com.diasporaunlocked.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$info")" = iphoneos
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$info")" = iPhoneOS
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info")
          test -x "$app/$executable"
          xcrun lipo "$app/$executable" -verify_arch arm64
          xcrun vtool -arch arm64 -show-build "$app/$executable" | grep -Eq 'platform[[:space:]]+IOS$'
          test ! -e "$app/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$archive/Info.plist"
          xcrun lipo -archs "$app/$executable" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 "$app/$executable" >> "$GITHUB_STEP_SUMMARY"
          echo 'com.diasporaunlocked.app, generic physical iOS, Release, no distribution signature' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the qualified unsigned archive for the release owner
        run: |
          ditto -c -k -X --keepParent "$RUNNER_TEMP/DiasporaUnlocked.xcarchive" "$RUNNER_TEMP/Diaspora-Unlocked-unsigned-xcarchive.zip"
          shasum -a 256 "$RUNNER_TEMP/Diaspora-Unlocked-unsigned-xcarchive.zip" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-device-archive-672e64f
          path: ${{ runner.temp }}/Diaspora-Unlocked-unsigned-xcarchive.zip
          if-no-files-found: error
          retention-days: 2
