name: CI/CD Pipeline

on:
  # Run full pipeline on main/develop pushes.
  push:
    branches: [main, develop]
  # Validate incoming changes before merge to main.
  pull_request:
    branches: [main]

# Set environment variables at the top level for cleaner code
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # 1) Baseline quality gate used by deployment jobs.
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Type check
        run: pnpm check

      - name: Guardrails (Build Safety)
        run: pnpm guardrails
      
      - name: Build project (CI Check)
        run: pnpm build

  # 2) Production deploy is gated on CI and only runs for direct main pushes.
  deploy-vercel-production:
    name: Deploy to Vercel (Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      
      - name: Pull Vercel Environment Information
        # This downloads the VITE_SITE_URL you set in Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        # Build from source on Vercel to avoid stale local .vercel/output artifacts.
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

  # 3) Preview deploys are created for pull requests.
  deploy-vercel-preview:
    name: Deploy to Vercel (Preview)
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest
      
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        # Build from source on Vercel to avoid stale local .vercel/output artifacts.
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}

  # 4) Non-blocking formatting visibility; does not fail the pipeline.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Prettier check
        run: pnpm format --check || echo "Prettier check completed"
