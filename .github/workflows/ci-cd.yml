name: CI/CD Pipeline

on:
  # Run full pipeline on main/develop pushes.
  push:
    branches: [main, develop]
  # Validate incoming changes before merge to main.
  pull_request:
    branches: [main]

# Set environment variables at the top level for cleaner code
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # 1) Baseline quality gate — ALL deployment jobs are blocked until this passes.
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Guardrails (Build Safety)
        run: pnpm guardrails

      - name: Build project
        run: pnpm build

  # 2) Production deploy — only on direct pushes to main, only if build-and-test passed.
  #    On failure, rolls back to the last successful Vercel production deployment.
  deploy-vercel-production:
    name: Deploy to Vercel (Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        id: vercel_deploy
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Rollback on deployment failure
        if: failure() && steps.vercel_deploy.conclusion == 'failure'
        run: |
          echo "Deployment failed — rolling back to last successful production deployment."
          vercel rollback --token=${{ secrets.VERCEL_TOKEN }} --yes
          echo "Rollback complete."

  # 3) Preview deploys for pull requests — only if build-and-test passed.
  deploy-vercel-preview:
    name: Deploy to Vercel (Preview)
    needs: build-and-test
    if: github.event_name == 'pull_request' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Preview
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}

  # 4) Non-blocking formatting visibility; does not gate deployment.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format --check || echo "Prettier check completed"
