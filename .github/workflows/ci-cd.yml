name: CI/CD Pipeline

on:
  # Run full pipeline on main/develop pushes.
  push:
    branches: [main, develop]
  # Validate incoming changes before merge to main.
  pull_request:
    branches: [main]

# GitHub Actions owns deployment; cancel obsolete PR runs and serialize releases.
concurrency:
  group: du-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set environment variables at the top level for cleaner code
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # 1) Baseline quality gate — ALL deployment jobs are blocked until this passes.
  build-and-test:
    name: Build and Test
    # Playwright 1.58 supports this release; ubuntu-latest can advance ahead of it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x]
    services:
      newsletter-mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: newsletter-ci-test-only
          MYSQL_DATABASE: du_newsletter_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnewsletter-ci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Type check
        run: pnpm check

      - name: Oracle deployment safety regressions
        run: pnpm test:deploy

      - name: Module tests
        run: pnpm test:modules
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test
          NEWSLETTER_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Restored application and held-worker recovery
        run: pnpm test:recovery:application
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Synthetic encrypted recovery custody
        run: pnpm test:recovery:custody

      - name: Mac backup safety and scheduling regressions
        run: |
          pnpm test:backup:mac
          bash -n deploy/oracle/verify-recovery.sh deploy/oracle/mac-backup.sh

      - name: Frontend tests
        run: pnpm test:frontend

      - name: Onesa provider HTTP regression tests
        run: pnpm test:e2e:onesa:runtime

      - name: Guardrails (Build Safety)
        run: pnpm guardrails

      - name: Validate translations
        run: pnpm translations:check

      - name: Build project with isolated catalogue fixture
        run: |
          node --import tsx scripts/create-catalogue-fixture.mjs "$RUNNER_TEMP/du-catalogue.json"
          DU_PUBLIC_CATALOGUE_FILE="$RUNNER_TEMP/du-catalogue.json" pnpm build

      - name: Initial HTML and canonical SEO regression checks
        run: pnpm test:seo

      - name: Install browsers for regression tests
        run: |
          # Avoid the runner's Azure mirror, which repeatedly throttled browser dependencies.
          # Keep Ubuntu's signed repositories and every browser test unchanged.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pnpm exec playwright install --with-deps chromium webkit

      - name: Focused basket pricing and product information journeys
        run: pnpm test:e2e:shop:followup

      - name: Prelaunch and confirmed product-interest browser journeys
        run: pnpm test:e2e:prelaunch
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Transactional contact and password recovery browser workflows
        run: pnpm test:e2e:transactional
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Newsletter database and admin workflow regression tests
        run: pnpm test:e2e:newsletter
        env:
          NEWSLETTER_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test
          NEWSLETTER_BROWSER_CHANNEL: chromium

      - name: Navigation regression tests
        run: pnpm test:e2e:navigation
        env:
          NAVIGATION_BROWSER_CHANNEL: chromium

      - name: Onesa chat regression tests
        run: pnpm test:e2e:onesa:chat
        env:
          ONESA_BROWSER_CHANNEL: chromium

      - name: Onesa WebKit chat regression tests
        run: pnpm test:e2e:onesa:chat
        env:
          ONESA_BROWSER_ENGINE: webkit

      - name: Shop cart regression tests
        run: pnpm test:e2e:shop
        env:
          SHOP_BROWSER_CHANNEL: chromium

      - name: Shop integrated HTTP browser workflow
        run: pnpm test:e2e:shop:integrated
        env:
          SHOP_BROWSER_CHANNEL: chromium

      - name: Shop MySQL transaction regressions
        run: node --import tsx scripts/tests/shop-database.mjs
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Responsive public pages and frontend CSP
        run: pnpm test:e2e:pilot:layout

      - name: Assisted-order pilot Chromium journey
        run: pnpm test:e2e:pilot
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Assisted-order pilot WebKit journey
        run: pnpm test:e2e:pilot
        env:
          PILOT_BROWSER: webkit
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Protected shop admin and regional checkout regressions
        run: pnpm test:e2e:shop:admin
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Shop WebKit cart regression tests
        run: pnpm test:e2e:shop
        env:
          SHOP_BROWSER_ENGINE: webkit

      - name: Swipeable discovery regression tests
        run: pnpm test:e2e:discovery
        env:
          DISCOVERY_BROWSER_CHANNEL: chromium

      - name: Site-wide UI consistency and accessible dialog regressions
        run: pnpm test:e2e:ui

      - name: Weather location and forecast browser workflows
        run: pnpm test:e2e:weather

      - name: Browser appearance preferences and Travel navigation
        run: pnpm test:e2e:theme

      - name: Travel journey Chromium
        run: pnpm test:e2e:travel

      - name: Travel journey WebKit
        run: pnpm test:e2e:travel
        env:
          TRAVEL_BROWSER: webkit

      - name: VR music toggle regression tests
        run: pnpm test:e2e:vr:music

      - name: VR WebKit music toggle regression tests
        run: pnpm test:e2e:vr:music
        env:
          VR_MUSIC_BROWSER_ENGINE: webkit

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/du-travel-*/report.json
            /tmp/du-travel-*/failure.png
            /tmp/du-travel-*/failure.html
            /tmp/du-weather-review/report.json
            /tmp/du-theme-review/report.json

  # Native ARM64 build and release on the shared Oracle VM, scoped to DU only.
  deploy-oracle-production:
    name: Deploy to Oracle (Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5

      - name: Wait for verified Oracle release
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/tests/wait-for-oracle-release.mjs

      - name: Verify Oracle and public API release
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/tests/verify-backend-release.mjs

  # 2) Production deploy — only on direct pushes to main, only if build-and-test passed.
  #    On failure, rolls back to the last successful Vercel production deployment.
  deploy-vercel-production:
    name: Deploy to Vercel (Production)
    needs: [build-and-test, deploy-oracle-production]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success' && needs.deploy-oracle-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: pnpm add -g vercel@65.4.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Record current production target for rollback
        id: previous_production
        run: |
          vercel inspect https://www.diasporaunlocked.com --json --token=${{ secrets.VERCEL_TOKEN }} > "$RUNNER_TEMP/du-previous-deployment.json"
          node scripts/vercel-previous-target.mjs "$RUNNER_TEMP/du-previous-deployment.json" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel Production
        id: vercel_deploy
        run: vercel deploy --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify published browser API routing and canonical pages
        run: node scripts/tests/verify-published-site.mjs

      - name: Verify matching Oracle release through the deployed frontend
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/tests/verify-backend-release.mjs

      - name: Rollback on deployment failure
        if: failure() && (steps.vercel_deploy.conclusion == 'failure' || steps.vercel_deploy.conclusion == 'success')
        run: |
          echo "Deployment or verification failed — rolling back to the previous production deployment."
          vercel rollback "${{ steps.previous_production.outputs.deployment }}" --token=${{ secrets.VERCEL_TOKEN }} --yes
          vercel rollback status --token=${{ secrets.VERCEL_TOKEN }}
          echo "Rollback complete."

  # 3) Preview deploys for pull requests — only if build-and-test passed.
  deploy-vercel-preview:
    name: Deploy to Vercel (Preview)
    needs: build-and-test
    # Draft review runs all checks without publishing an external preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Vercel CLI
        run: pnpm add -g vercel@65.4.0

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Isolate preview from production data
        run: node scripts/prepare-preview.mjs

      - name: Deploy to Vercel Preview
        id: preview_deploy
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify isolated preview
        env:
          PILOT_PREVIEW_URL: ${{ steps.preview_deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/tests/pilot-preview.mjs

  # 4) Non-blocking formatting visibility; does not gate deployment.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format:check || echo "Prettier check completed"
