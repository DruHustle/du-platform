name: CI/CD Pipeline

on:
  # Run full pipeline on main/develop pushes.
  push:
    branches: [main, develop]
  # Validate incoming changes before merge to main.
  pull_request:
    branches: [main]

# GitHub Actions owns deployment; cancel obsolete PR runs and serialize releases.
concurrency:
  group: du-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Set environment variables at the top level for cleaner code
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Render is the only production backend. Service/workspace/origin remain
  # explicit, and every release verifies the exact tested source and database.
  DU_BACKEND_HOST: ${{ vars.DU_BACKEND_HOST }}
  DU_RENDER_API_ORIGIN: ${{ vars.DU_RENDER_API_ORIGIN }}
  DU_RENDER_SERVICE_ID: ${{ vars.DU_RENDER_SERVICE_ID }}
  DU_RENDER_WORKSPACE_ID: ${{ vars.DU_RENDER_WORKSPACE_ID }}

jobs:
  # 1) Baseline quality gate — ALL deployment jobs are blocked until this passes.
  build-and-test:
    name: Build and Test
    # Playwright 1.58 supports this release; ubuntu-latest can advance ahead of it.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [22.x]
    services:
      newsletter-mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: newsletter-ci-test-only
          MYSQL_DATABASE: du_newsletter_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnewsletter-ci-test-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate optional MySQL container configuration
        run: python3 du-platform-backend/deploy/database/test_configuration.py --require-compose

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: du-platform-frontend/tooling/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir du-platform-frontend/tooling install --frozen-lockfile

      - name: Install independent application dependencies
        run: |
          pnpm --dir du-platform-frontend/web install --frozen-lockfile
          pnpm --dir du-platform-backend install --frozen-lockfile
          npm --prefix du-platform-frontend/mobile ci --no-audit --no-fund

      - name: Verify application boundaries and isolated builds
        run: |
          pnpm --dir du-platform-frontend/tooling check:architecture
          node --test du-platform-frontend/tooling/scripts/tests/architecture.test.mjs
          pnpm --dir du-platform-frontend/tooling test:isolation

      - name: Verify tracked native projects match Expo configuration
        run: |
          npm --prefix du-platform-frontend/mobile run native:generate
          git diff --exit-code -- du-platform-frontend/mobile/ios du-platform-frontend/mobile/android
          test -z "$(git status --porcelain --untracked-files=all -- du-platform-frontend/mobile/ios du-platform-frontend/mobile/android)"

      - name: Audit web production dependencies
        run: pnpm --dir du-platform-frontend/web audit --prod --audit-level=moderate

      - name: Audit backend production dependencies
        run: pnpm --dir du-platform-backend audit --prod --audit-level=moderate

      - name: Audit repository tooling production dependencies
        run: pnpm --dir du-platform-frontend/tooling audit --prod --audit-level=moderate

      - name: Type check
        run: pnpm --dir du-platform-frontend/tooling check

      - name: Backend and Vercel deployment safety regressions
        run: pnpm --dir du-platform-frontend/tooling test:deploy

      - name: Module tests
        run: pnpm --dir du-platform-frontend/tooling test:modules
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test
          NEWSLETTER_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Verify-only MySQL startup preserves existing data
        run: pnpm --dir du-platform-backend exec vitest run --config vitest.config.ts modules/tests/databaseStartup.test.ts modules/tests/databaseStartup.mysql.test.ts
        env:
          STARTUP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Restored application and held-worker recovery
        run: pnpm --dir du-platform-frontend/tooling test:recovery:application
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Synthetic encrypted recovery custody
        run: pnpm --dir du-platform-frontend/tooling test:recovery:custody

      - name: Mac backup safety and scheduling regressions
        run: |
          pnpm --dir du-platform-frontend/tooling test:backup:mac
          bash -n du-platform-backend/deploy/oracle/verify-recovery.sh du-platform-backend/deploy/oracle/mac-backup.sh

      - name: Frontend tests
        run: pnpm --dir du-platform-frontend/tooling test:frontend

      - name: Onesa provider HTTP regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:onesa:runtime

      - name: Guardrails (Build Safety)
        run: pnpm --dir du-platform-frontend/tooling guardrails

      - name: Validate translations
        run: pnpm --dir du-platform-frontend/tooling translations:check

      - name: Build project with isolated catalogue fixture
        run: |
          node --import ./du-platform-frontend/tooling/node_modules/tsx/dist/loader.mjs du-platform-frontend/tooling/scripts/create-catalogue-fixture.mjs "$RUNNER_TEMP/du-catalogue.json"
          DU_PUBLIC_CATALOGUE_FILE="$RUNNER_TEMP/du-catalogue.json" pnpm --dir du-platform-frontend/tooling build

      - name: Initial HTML and canonical SEO regression checks
        run: pnpm --dir du-platform-frontend/tooling test:seo

      - name: Install browsers for regression tests
        run: |
          # Avoid the runner's Azure mirror, which repeatedly throttled browser dependencies.
          # Keep Ubuntu's signed repositories and every browser test unchanged.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          pnpm --dir du-platform-frontend/tooling exec playwright install --with-deps chromium webkit

      - name: Swipeable discovery regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:discovery
        env:
          DISCOVERY_BROWSER_CHANNEL: chromium

      - name: Preserve Home animation visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-animation-visual-checks
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/du-discovery-tests/home-waterfall-*.png
            /tmp/du-discovery-tests/report.json
            /tmp/du-discovery-tests/failure.png

      - name: Navigation regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:navigation
        env:
          NAVIGATION_BROWSER_CHANNEL: chromium

      - name: Focused basket pricing and product information journeys
        run: pnpm --dir du-platform-frontend/tooling test:e2e:shop:followup

      - name: Prelaunch and confirmed product-interest browser journeys
        run: pnpm --dir du-platform-frontend/tooling test:e2e:prelaunch
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Transactional contact and password recovery browser workflows
        run: pnpm --dir du-platform-frontend/tooling test:e2e:transactional
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Newsletter database and admin workflow regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:newsletter
        env:
          NEWSLETTER_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test
          NEWSLETTER_BROWSER_CHANNEL: chromium

      - name: Onesa chat regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:onesa:chat
        env:
          ONESA_BROWSER_CHANNEL: chromium

      - name: Onesa WebKit chat regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:onesa:chat
        env:
          ONESA_BROWSER_ENGINE: webkit

      - name: Preserve responsive assistant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-assistant-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: /tmp/du-onesa-chat-*

      - name: Shop cart regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:shop
        env:
          SHOP_BROWSER_CHANNEL: chromium

      - name: Shop integrated HTTP browser workflow
        run: pnpm --dir du-platform-frontend/tooling test:e2e:shop:integrated
        env:
          SHOP_BROWSER_CHANNEL: chromium

      - name: Shop MySQL transaction regressions
        run: node --import ./du-platform-frontend/tooling/node_modules/tsx/dist/loader.mjs du-platform-frontend/tooling/scripts/tests/shop-database.mjs
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Responsive public pages and frontend CSP
        run: pnpm --dir du-platform-frontend/tooling test:e2e:pilot:layout

      - name: Assisted-order pilot Chromium journey
        run: pnpm --dir du-platform-frontend/tooling test:e2e:pilot
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Assisted-order pilot WebKit journey
        run: pnpm --dir du-platform-frontend/tooling test:e2e:pilot
        env:
          PILOT_BROWSER: webkit
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Protected shop admin and regional checkout regressions
        run: pnpm --dir du-platform-frontend/tooling test:e2e:shop:admin
        env:
          SHOP_TEST_DATABASE_URL: mysql://root:newsletter-ci-test-only@127.0.0.1:3306/du_newsletter_test

      - name: Shop WebKit cart regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:shop
        env:
          SHOP_BROWSER_ENGINE: webkit

      - name: Site-wide UI consistency and accessible dialog regressions
        run: pnpm --dir du-platform-frontend/tooling test:e2e:ui

      - name: Weather location and forecast browser workflows
        run: pnpm --dir du-platform-frontend/tooling test:e2e:weather

      - name: Browser appearance preferences and Travel navigation
        run: pnpm --dir du-platform-frontend/tooling test:e2e:theme

      - name: Travel journey Chromium
        run: pnpm --dir du-platform-frontend/tooling test:e2e:travel

      - name: Travel journey WebKit
        run: pnpm --dir du-platform-frontend/tooling test:e2e:travel
        env:
          TRAVEL_BROWSER: webkit

      - name: VR music toggle regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:vr:music

      - name: VR WebKit music toggle regression tests
        run: pnpm --dir du-platform-frontend/tooling test:e2e:vr:music
        env:
          VR_MUSIC_BROWSER_ENGINE: webkit

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            /tmp/du-shop-tests/report.json
            /tmp/du-shop-tests/failure.png
            /tmp/du-travel-*/report.json
            /tmp/du-travel-*/failure.png
            /tmp/du-travel-*/failure.html
            /tmp/du-weather-review/report.json
            /tmp/du-theme-review/report.json

  # Explicit, tested-commit deployment. The Render service must have auto-deploy
  # disabled; no service creation, secret replacement or cron is performed here.
  deploy-render-production:
    name: Deploy to Render (Production)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success' && (vars.DU_BACKEND_HOST == '' || vars.DU_BACKEND_HOST == 'render')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      origin: ${{ steps.release.outputs.origin }}
      service_id: ${{ steps.release.outputs.service_id }}
      workspace_id: ${{ steps.release.outputs.workspace_id }}
      deploy_id: ${{ steps.release.outputs.deploy_id }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5

      - name: Deploy and verify the tested Render revision
        id: release
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node du-platform-frontend/tooling/scripts/deploy-render-production.mjs

  # 2) Production deploy — only on direct pushes to main, only if build-and-test passed.
  #    On failure, rolls back to the last successful Vercel production deployment.
  deploy-vercel-production:
    name: Deploy to Vercel (Production)
    needs: [build-and-test, deploy-render-production]
    # The complete quality gate and exact Render release must both succeed.
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success' &&
      (vars.DU_BACKEND_HOST == '' || vars.DU_BACKEND_HOST == 'render') && needs.deploy-render-production.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install Vercel CLI
        run: pnpm add -g vercel@65.4.0

      - name: Prepare isolated Vercel source
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          VERIFIED_BACKEND_REVISION: ${{ needs.deploy-render-production.outputs.revision }}
          VERIFIED_RENDER_ORIGIN: ${{ needs.deploy-render-production.outputs.origin }}
          VERIFIED_RENDER_SERVICE_ID: ${{ needs.deploy-render-production.outputs.service_id }}
          VERIFIED_RENDER_WORKSPACE_ID: ${{ needs.deploy-render-production.outputs.workspace_id }}
          VERIFIED_RENDER_DEPLOY_ID: ${{ needs.deploy-render-production.outputs.deploy_id }}
        run: node du-platform-frontend/tooling/scripts/prepare-vercel-source.mjs "$RUNNER_TEMP/du-vercel-stage" --production

      - name: Pull Vercel Environment Information
        run: vercel pull --cwd "$RUNNER_TEMP/du-vercel-stage" --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Record current production target for rollback
        id: previous_production
        run: |
          vercel inspect --cwd "$RUNNER_TEMP/du-vercel-stage" https://www.diasporaunlocked.com --json --token=${{ secrets.VERCEL_TOKEN }} > "$RUNNER_TEMP/du-previous-deployment.json"
          node du-platform-frontend/tooling/scripts/vercel-previous-target.mjs "$RUNNER_TEMP/du-previous-deployment.json" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel Production
        id: vercel_deploy
        run: vercel deploy --cwd "$RUNNER_TEMP/du-vercel-stage" --yes --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Verify published browser API routing and canonical pages
        run: node du-platform-frontend/tooling/scripts/tests/verify-published-site.mjs

      - name: Verify matching backend release through the deployed frontend
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node du-platform-frontend/tooling/scripts/tests/verify-backend-release.mjs

      - name: Rollback on deployment failure
        if: failure() && (steps.vercel_deploy.conclusion == 'failure' || steps.vercel_deploy.conclusion == 'success')
        run: |
          echo "Deployment or verification failed — rolling back to the previous production deployment."
          vercel rollback --cwd "$RUNNER_TEMP/du-vercel-stage" "${{ steps.previous_production.outputs.deployment }}" --token=${{ secrets.VERCEL_TOKEN }} --yes
          vercel rollback status --cwd "$RUNNER_TEMP/du-vercel-stage" --token=${{ secrets.VERCEL_TOKEN }}
          echo "Rollback complete."

  # 3) Preview deploys for pull requests — only if build-and-test passed.
  deploy-vercel-preview:
    name: Deploy to Vercel (Preview)
    needs: build-and-test
    # Draft review runs all checks without publishing an external preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install Vercel CLI
        run: pnpm add -g vercel@65.4.0

      - name: Prepare isolated Vercel source
        run: node du-platform-frontend/tooling/scripts/prepare-vercel-source.mjs "$RUNNER_TEMP/du-vercel-stage"

      - name: Pull Vercel Environment Information
        run: vercel pull --cwd "$RUNNER_TEMP/du-vercel-stage" --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Isolate preview from production data
        run: node du-platform-frontend/tooling/scripts/prepare-preview.mjs "$RUNNER_TEMP/du-vercel-stage/du-platform-frontend/web/vercel.json"

      - name: Deploy to Vercel Preview
        id: preview_deploy
        run: |
          url=$(vercel deploy --cwd "$RUNNER_TEMP/du-vercel-stage" --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify isolated preview
        env:
          PILOT_PREVIEW_URL: ${{ steps.preview_deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node du-platform-frontend/tooling/scripts/tests/pilot-preview.mjs

  # 4) Non-blocking formatting visibility; does not gate deployment.
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: du-platform-frontend/tooling/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir du-platform-frontend/tooling install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm --dir du-platform-frontend/tooling format:check || echo "Prettier check completed"
