name: iPhone installed support and directory retry
on:
  push:
    branches: [validation/ios-support-recovery-20261113]
permissions:
  contents: read
concurrency:
  group: installed-support-research-${{ github.ref }}
  cancel-in-progress: true
env:
  EXPO_PUBLIC_API_URL: http://localhost:9093/api
  EXPO_PUBLIC_WEB_URL: https://www.diasporaunlocked.com
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 85
    defaults:
      run:
        working-directory: du-platform-frontend/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: du-platform-frontend/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: pod install --project-directory=ios
      - run: |
          cp scripts/store-screens/ExtendedJourneyTests.swift scripts/store-screens/DUNativeSmokeTests.swift
          ruby scripts/store-screens/prepare-ui-tests.rb ios/DiasporaUnlocked.xcodeproj
      - name: Run installed iPhone support, consent and research journeys
        run: |
          python3 scripts/store-screens/contact-fixture.py 9093 > "$RUNNER_TEMP/fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          python3 scripts/store-screens/extended-ios.py
          grep 'PASS isolated inbox' "$RUNNER_TEMP/fixture.log"
