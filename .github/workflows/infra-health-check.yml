name: Infra Health Check

on:
  # Run this on a short interval so outages are detected quickly.
  schedule:
    - cron: "*/15 * * * *"
  # Keep manual execution available for testing configuration changes.
  workflow_dispatch:

jobs:
  app-health:
    name: Health Check App
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate app liveness JSON
        env:
          # Primary app health endpoint. Prefer a repo variable, but allow secret fallback.
          KEEPALIVE_URL: ${{ vars.BACKEND_HEALTH_URL || vars.RENDER_KEEPALIVE_URL || secrets.RENDER_KEEPALIVE_URL }}
          # Optional DB URL used only to derive the app origin if KEEPALIVE_URL is unset.
          RENDER_DB_KEEPALIVE_URL: ${{ vars.BACKEND_DATABASE_HEALTH_URL || vars.RENDER_DB_KEEPALIVE_URL || secrets.RENDER_DB_KEEPALIVE_URL }}
          # Allow some time for cold starts on the hosting side.
          KEEPALIVE_TIMEOUT_SECONDS: "30"
        run: |
          APP_URL="$(echo "${KEEPALIVE_URL:-}" | xargs)"
          DB_URL="$(echo "${RENDER_DB_KEEPALIVE_URL:-}" | xargs)"

          # If only the DB URL is configured, infer the same service origin for /api/ping.
          if [[ -z "$APP_URL" && -n "$DB_URL" ]]; then
            APP_ORIGIN="$(echo "$DB_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            APP_URL="${APP_ORIGIN}/api/ping"
          fi

          if [[ -z "$APP_URL" ]]; then
            echo "[keepalive] Missing app URL."
            echo "[keepalive] Set one of: vars.RENDER_KEEPALIVE_URL, secrets.RENDER_KEEPALIVE_URL, vars.RENDER_DB_KEEPALIVE_URL, secrets.RENDER_DB_KEEPALIVE_URL"
            exit 1
          fi

          ./scripts/healthcheck-json.sh "$APP_URL" app-ping

  db-health:
    name: Health Check DB
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate DB health JSON
        env:
          # Explicit DB health URL if you want to override the derived default.
          RENDER_DB_KEEPALIVE_URL: ${{ vars.BACKEND_DATABASE_HEALTH_URL || vars.RENDER_DB_KEEPALIVE_URL || secrets.RENDER_DB_KEEPALIVE_URL }}
          # Fallback source used to derive the service origin.
          RENDER_KEEPALIVE_URL: ${{ vars.BACKEND_HEALTH_URL || vars.RENDER_KEEPALIVE_URL || secrets.RENDER_KEEPALIVE_URL }}
          KEEPALIVE_TIMEOUT_SECONDS: "30"
        run: |
          DB_URL="$(echo "${RENDER_DB_KEEPALIVE_URL:-}" | xargs)"
          APP_URL="$(echo "${RENDER_KEEPALIVE_URL:-}" | xargs)"

          if [[ -z "$DB_URL" ]]; then
            if [[ -z "$APP_URL" ]]; then
              echo "[keepalive] Missing both RENDER_DB_KEEPALIVE_URL and RENDER_KEEPALIVE_URL."
              exit 1
            fi
            # Default DB health path on the same backend service.
            APP_ORIGIN="$(echo "$APP_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            DB_URL="${APP_ORIGIN}/api/health/db"
          fi

          ./scripts/healthcheck-json.sh "$DB_URL" db-health

  onesa-health:
    name: Health Check Onesa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Onesa readiness JSON
        env:
          # Optional explicit Onesa readiness URL.
          RENDER_ONESA_READY_URL: ${{ vars.BACKEND_ONESA_HEALTH_URL || vars.RENDER_ONESA_READY_URL || secrets.RENDER_ONESA_READY_URL }}
          # Fallback sources used to derive the backend origin if the explicit Onesa URL is absent.
          RENDER_KEEPALIVE_URL: ${{ vars.BACKEND_HEALTH_URL || vars.RENDER_KEEPALIVE_URL || secrets.RENDER_KEEPALIVE_URL }}
          RENDER_DB_KEEPALIVE_URL: ${{ vars.BACKEND_DATABASE_HEALTH_URL || vars.RENDER_DB_KEEPALIVE_URL || secrets.RENDER_DB_KEEPALIVE_URL }}
          KEEPALIVE_TIMEOUT_SECONDS: "30"
        run: |
          ONESA_URL="$(echo "${RENDER_ONESA_READY_URL:-}" | xargs)"
          APP_URL="$(echo "${RENDER_KEEPALIVE_URL:-}" | xargs)"
          DB_URL="$(echo "${RENDER_DB_KEEPALIVE_URL:-}" | xargs)"

          # Prefer deriving from the app URL first, then the DB URL.
          if [[ -z "$ONESA_URL" && -n "$APP_URL" ]]; then
            APP_ORIGIN="$(echo "$APP_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            ONESA_URL="${APP_ORIGIN}/api/ai/ready"
          fi

          if [[ -z "$ONESA_URL" && -n "$DB_URL" ]]; then
            APP_ORIGIN="$(echo "$DB_URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            ONESA_URL="${APP_ORIGIN}/api/ai/ready"
          fi

          if [[ -z "$ONESA_URL" ]]; then
            echo "[healthcheck] Missing Onesa readiness URL."
            echo "[healthcheck] Set vars.RENDER_ONESA_READY_URL or provide RENDER_KEEPALIVE_URL / RENDER_DB_KEEPALIVE_URL."
            exit 1
          fi

          ./scripts/healthcheck-json.sh "$ONESA_URL" onesa-ready

  notify-failure:
    name: Email Health Alert
    runs-on: ubuntu-latest
    needs: [app-health, db-health, onesa-health]
    # Always evaluate this job, but only send email if any of the health jobs failed.
    if: ${{ always() && (needs.app-health.result == 'failure' || needs.db-health.result == 'failure' || needs.onesa-health.result == 'failure') }}
    steps:
      - name: Validate SMTP alert configuration
        env:
          # Recipient and sender can be stored as vars or secrets.
          HEALTHCHECK_ALERT_TO: ${{ vars.HEALTHCHECK_ALERT_TO || secrets.HEALTHCHECK_ALERT_TO }}
          HEALTHCHECK_ALERT_FROM: ${{ vars.HEALTHCHECK_ALERT_FROM || secrets.HEALTHCHECK_ALERT_FROM }}
          # SMTP credentials should stay in secrets.
          HEALTHCHECK_SMTP_SERVER: ${{ secrets.HEALTHCHECK_SMTP_SERVER }}
          HEALTHCHECK_SMTP_PORT: ${{ secrets.HEALTHCHECK_SMTP_PORT }}
          HEALTHCHECK_SMTP_USERNAME: ${{ secrets.HEALTHCHECK_SMTP_USERNAME }}
          HEALTHCHECK_SMTP_PASSWORD: ${{ secrets.HEALTHCHECK_SMTP_PASSWORD }}
        run: |
          missing=0
          for name in HEALTHCHECK_ALERT_TO HEALTHCHECK_ALERT_FROM HEALTHCHECK_SMTP_SERVER HEALTHCHECK_SMTP_PORT HEALTHCHECK_SMTP_USERNAME HEALTHCHECK_SMTP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "[alert] Missing ${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "[alert] Health check failed, but SMTP email alert configuration is incomplete."
            exit 1
          fi

      - name: Send failure alert email
        # External action that sends the email once any health job has failed.
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.HEALTHCHECK_SMTP_SERVER }}
          server_port: ${{ secrets.HEALTHCHECK_SMTP_PORT }}
          username: ${{ secrets.HEALTHCHECK_SMTP_USERNAME }}
          password: ${{ secrets.HEALTHCHECK_SMTP_PASSWORD }}
          secure: ${{ vars.HEALTHCHECK_SMTP_SECURE || 'false' }}
          subject: "[Diaspora Unlocked] Infra health check failed"
          to: ${{ vars.HEALTHCHECK_ALERT_TO || secrets.HEALTHCHECK_ALERT_TO }}
          from: ${{ vars.HEALTHCHECK_ALERT_FROM || secrets.HEALTHCHECK_ALERT_FROM }}
          body: |
            Diaspora Unlocked infrastructure health check detected a failure.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}

            Results:
            - App health: ${{ needs.app-health.result }}
            - DB health: ${{ needs.db-health.result }}
            - Onesa readiness: ${{ needs.onesa-health.result }}

            Check the failing job logs in GitHub Actions and Oracle container logs for the underlying cause.
