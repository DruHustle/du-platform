name: Render Keepalive

on:
  # Low-frequency backup ping. Primary keepalive is handled externally (cron-job.org).
  schedule:
    - cron: "0 */4 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Render Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ping keepalive URL
        env:
          # Set this repo secret to your backend keepalive endpoint (recommended: /api/ping). https://zigd-platform.onrender.com/api/ping
          KEEPALIVE_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
          # Curl timeout in seconds for slow/cold starts.
          KEEPALIVE_TIMEOUT_SECONDS: "30"
        run: |
          ./scripts/keepalive-ping.sh
