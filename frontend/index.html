<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title><%= VITE_SITE_NAME %></title> 
    <meta name="description" content="Platform" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= VITE_SITE_NAME %>" />
    <meta property="og:url" content="<%= VITE_SITE_URL %>/" />
    <link rel="canonical" href="<%= VITE_SITE_URL %>/" />
    <meta property="og:title" content="<%= VITE_SITE_NAME %>" />

    <meta property="og:image" content="<%= VITE_SITE_URL %>/images/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="<%= VITE_SITE_URL %>/images/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="fb:app_id" content="1483080213178422" />
    <meta name="msvalidate.01" content="EE42AEFD23142861B60C85F85CAE309B" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= VITE_SITE_NAME %>" />
    <meta name="twitter:image" content="<%= VITE_SITE_URL %>/images/og-image.png?v=2" />

    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/favicon.png" />
    <link rel="image_src" href="<%= VITE_SITE_URL %>/images/favicon.png" />
    <link rel="preload" as="image" href="/images/pages/tourism/victoria_falls.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html {
        min-height: 100%;
        background-color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        min-height: max(884px, 100dvh);
        background-color: #0f172a;
        background:
          radial-gradient(circle at top, rgba(250, 204, 21, 0.16), transparent 34%),
          linear-gradient(180deg, #f8fafc 0%, #eef2f7 48%, #f8fafc 100%);
      }

      .seo-h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #root {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        min-height: max(884px, 100dvh);
        background-color: transparent;
      }

      /* Shell skeleton — visible immediately on first paint, removed when React mounts */
      #app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        min-height: max(884px, 100dvh);
      }
      #app-shell-nav {
        height: 64px;
        background: rgba(255,255,255,0.72);
        border-bottom: 1px solid rgba(0,0,0,0.06);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 16px;
        backdrop-filter: blur(12px);
        box-sizing: border-box;
      }
      #app-shell-body {
        flex: 1;
        padding: 48px 24px 24px;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        box-sizing: border-box;
      }
      @keyframes _shell-shimmer {
        0%   { opacity: 0.55; }
        50%  { opacity: 1; }
        100% { opacity: 0.55; }
      }
      .s {
        border-radius: 8px;
        background: rgba(0,0,0,0.07);
        animation: _shell-shimmer 1.4s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <noscript>
      <h1 class="seo-h1">Diaspora Unlocked Platform</h1>
    </noscript>
    <div id="root"><div id="app-shell" aria-hidden="true">
      <div id="app-shell-nav">
        <div class="s" style="width:110px;height:28px;"></div>
        <div style="flex:1;"></div>
        <div class="s" style="width:68px;height:32px;border-radius:20px;"></div>
        <div class="s" style="width:68px;height:32px;border-radius:20px;"></div>
      </div>
      <div id="app-shell-body">
        <div class="s" style="width:55%;height:44px;margin-bottom:14px;"></div>
        <div class="s" style="width:38%;height:22px;margin-bottom:48px;opacity:.7;"></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;">
          <div class="s" style="height:180px;border-radius:16px;"></div>
          <div class="s" style="height:180px;border-radius:16px;animation-delay:.15s;"></div>
          <div class="s" style="height:180px;border-radius:16px;animation-delay:.3s;"></div>
        </div>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
