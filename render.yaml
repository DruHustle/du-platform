services:
  # ── Backend: Node.js fullstack server (Express + Vite-built frontend) ─────
  - type: web
    name: du-platform
    env: node
    buildCommand: pnpm install && pnpm build
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret on first deploy
      - key: TRUST_PROXY
        value: "true"
      # ── Database (Aiven MySQL) ──────────────────────────────────────────
      # Set these manually in the Render dashboard:
      # AIVEN_MYSQL_URL  |  AIVEN_MYSQL_HOST  |  AIVEN_MYSQL_PORT
      # AIVEN_MYSQL_USER |  AIVEN_MYSQL_PASSWORD  |  AIVEN_MYSQL_DATABASE
      # AIVEN_CA_CERT    (paste the full PEM certificate)
      # ── Email (Resend) ─────────────────────────────────────────────────
      # RESEND_API_KEY  |  FROM_EMAIL  |  APP_BASE_URL
      # ── AI (Onesa) ─────────────────────────────────────────────────────
      # ONESA_AI_BASE_URL  |  ONESA_AI_API_KEY
      # ── Admin ──────────────────────────────────────────────────────────
      # ADMIN_EMAILS  (comma-separated)
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
