{
  "services": {
    "app": {
      "networks": {
        "database": {}
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${DU_DATABASE_CA_FILE:?Use the existing trusted database CA file}",
          "target": "/run/du-db-ca/root.crt",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ]
    }
  },
  "networks": {
    "database": {
      "name": "du-platform-database",
      "external": true
    }
  }
}
