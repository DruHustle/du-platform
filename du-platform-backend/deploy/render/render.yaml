# Candidate only. Select this path explicitly; publishing it creates no resources.
# Approved target: a normal free web service in the user's My Workspace.
# Keep the current external Aiven database; no paid resource is defined here.
services:
  - type: web
    name: du-platform-api
    runtime: docker
    repo: https://github.com/DruHustle/du-platform
    branch: main
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./du-platform-backend/deploy/render/Dockerfile
    dockerContext: ./du-platform-backend
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_PROVIDER
        value: aiven
      - key: AIVEN_MYSQL_URL
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        value: https://www.diasporaunlocked.com
      - key: APP_BASE_URL
        value: https://www.diasporaunlocked.com
      - key: API_PUBLIC_URL
        sync: false
      - key: SHOP_COMMERCIAL_MODE
        value: prelaunch
      - key: OUTBOUND_MESSAGES_PAUSED
        value: "true"
