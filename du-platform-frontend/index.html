<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Diaspora Unlocked | Zimbabwe Diaspora Services</title>
    <meta
      name="description"
      content="Explore one platform for Zimbabwe tourism, investment, shopping, and AI support built for diaspora households and partners."
    />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZW" />
    <meta property="og:site_name" content="<%= VITE_SITE_NAME %>" />
    <meta property="og:url" content="<%= VITE_SITE_URL %>/" />
    <link rel="canonical" href="<%= VITE_SITE_URL %>/" />
    <meta
      property="og:title"
      content="Diaspora Unlocked | Zimbabwe Diaspora Services"
    />
    <meta
      property="og:description"
      content="Explore one platform for Zimbabwe tourism, investment, shopping, and AI support built for diaspora households and partners."
    />

    <meta
      property="og:image"
      content="<%= VITE_SITE_URL %>/images/og-image.png?v=2"
    />
    <meta
      property="og:image:secure_url"
      content="<%= VITE_SITE_URL %>/images/og-image.png?v=2"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Diaspora Unlocked Zimbabwe diaspora services"
    />

    <meta property="fb:app_id" content="1483080213178422" />
    <meta name="msvalidate.01" content="EE42AEFD23142861B60C85F85CAE309B" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Diaspora Unlocked | Zimbabwe Diaspora Services"
    />
    <meta
      name="twitter:description"
      content="Explore one platform for Zimbabwe tourism, investment, shopping, and AI support built for diaspora households and partners."
    />
    <meta
      name="twitter:image"
      content="<%= VITE_SITE_URL %>/images/og-image.png?v=2"
    />
    <meta
      name="twitter:image:alt"
      content="Diaspora Unlocked Zimbabwe diaspora services"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/favicon.png"
    />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/favicon.png" />
    <link rel="image_src" href="<%= VITE_SITE_URL %>/images/favicon.png" />
    <link
      rel="preload"
      as="image"
      href="/images/pages/tourism/victoria_falls.webp"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html {
        min-height: 100%;
        background-color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        background-color: #0f172a;
      }

      .seo-h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #root {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        background-color: transparent;
      }

      /* A quiet first paint while the application starts; no placeholder page. */
      #app-shell {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        min-height: 100dvh;
        background: #020617;
        color: #cbd5e1;
        font:
          14px system-ui,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <noscript>
      <h1 class="seo-h1">Diaspora Unlocked Zimbabwe Diaspora Services</h1>
    </noscript>
    <div id="root">
      <div id="app-shell" role="status" aria-live="polite">
        <img
          src="/images/brand/diaspora_unlocked.png"
          alt=""
          width="64"
          height="64"
        />
        <span>Loading Diaspora Unlocked…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
