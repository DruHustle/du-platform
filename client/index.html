<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>ZIGD Platform - Zimbabwe Global and Diaspora Platform</title>
    <meta
      name="description"
      content="Connecting the Zimbabwe Global and Diaspora community."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zigd-platform.vercel.app/" />
    <meta property="og:title" content="ZIGD Platform" />
    <meta
      property="og:description"
      content="Zimbabwe Global and Diaspora Platform"
    />
    <meta
      property="og:image"
      content="https://zigd-platform.vercel.app/images/zimbabwe_bird.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://zigd-platform.vercel.app/images/zimbabwe_bird.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZIGD Platform" />
    <meta
      name="twitter:image"
      content="https://zigd-platform.vercel.app/images/zimbabwe_bird.png"
    />

    <!-- Icons -->
    <link
      rel="icon"
      type="image/png"
      href="/images/zimbabwe_bird.png"
    />
    <link
      rel="image_src"
      href="https://zigd-platform.vercel.app/images/zimbabwe_bird.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
