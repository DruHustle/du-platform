<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title><%= VITE_SITE_NAME %> - Zimbabwe Global and Diaspora Platform</title> 
    <meta name="description" content="Connecting the Zimbabwe Global and Diaspora community." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= VITE_SITE_NAME %>" />
    <meta property="og:url" content="<%= VITE_SITE_URL %>" />
    <meta property="og:title" content="<%= VITE_SITE_NAME %>" />
    <meta property="og:description" content="Zimbabwe Global and Diaspora Platform" />

    <meta property="og:image" content="<%= VITE_SITE_URL %>/images/og-image.png" />
    <meta property="og:image:secure_url" content="<%= VITE_SITE_URL %>/images/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= VITE_SITE_NAME %>" />
    <meta name="twitter:description" content="Zimbabwe Global and Diaspora Platform" />
    <meta name="twitter:image" content="<%= VITE_SITE_URL %>/images/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/favicon.png" />
    <link rel="image_src" href="<%= VITE_SITE_URL %>/images/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
